name: Daily expense sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: expense-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAID_ENV: production
      PLAID_IMPORT_START_DATE: "2026-10-12"
      AMEX_IMPORT_START_DATE: "2026-10-05"
      EXPENSE_TIME_ZONE: America/New_York
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_ACCESS_TOKEN_CAPITAL_ONE: ${{ secrets.PLAID_ACCESS_TOKEN_CAPITAL_ONE }}
      PLAID_ACCESS_TOKEN_AMEX: ${{ secrets.PLAID_ACCESS_TOKEN_AMEX }}
      PLAID_ACCESS_TOKEN_VENMO: ${{ secrets.PLAID_ACCESS_TOKEN_VENMO }}
      AMEX_ALLOWED_ACCOUNT_OWNER: ${{ secrets.AMEX_ALLOWED_ACCOUNT_OWNER }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CATEGORY_OVERRIDES_JSON: ${{ secrets.CATEGORY_OVERRIDES_JSON }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Pull and categorize transactions
        run: node automation/sync-transactions.mjs
